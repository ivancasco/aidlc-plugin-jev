name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly live run against the Jev API, to notice model or API drift.
    - cron: "0 6 * * 1"

permissions:
  contents: read

env:
  # The AI-DLC release whose plugin tools and runtime the plugin is tested against.
  AIDLC_VERSION: "2.10.0"
  BUN_VERSION: "1.4.2"

jobs:
  unit:
    name: Offline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun test tests/

  compose:
    name: Compose (${{ matrix.harness }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        harness: [claude, codex, copilot, cursor, kiro, kiro-ide, opencode]
    # AI-DLC 2.10.0's compose hook looks for Codex skills under .codex/skills,
    # but the Codex runtime keeps them under .agents/skills, so any plugin
    # (including AI-DLC's own test-pro example) fails the idempotency check on
    # Codex. Not yet reported upstream; remove this once a fixed release is pinned.
    continue-on-error: ${{ matrix.harness == 'codex' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Validate, build and compose-test
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/compose-test.sh "${{ matrix.harness }}" "$AIDLC_VERSION"

  live:
    name: Live labelled sample
    runs-on: ubuntu-latest
    # Sends the synthetic fixture text to the Jev API. The TYPESAFE_API_KEY
    # secret lives in the `live` environment, which only `main` can deploy to;
    # pull requests never run this job, and forks never receive secrets.
    if: github.event_name != 'pull_request'
    environment: live
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Run live test
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          TYPESAFE_BASE_URL: ${{ vars.TYPESAFE_BASE_URL }}
          JEV_MODEL: ${{ vars.JEV_MODEL }}
        run: |
          if [ -z "$TYPESAFE_API_KEY" ]; then
            echo "::notice::TYPESAFE_API_KEY secret not set; skipping the live test."
            exit 0
          fi
          [ -n "$TYPESAFE_BASE_URL" ] || unset TYPESAFE_BASE_URL
          [ -n "$JEV_MODEL" ] || unset JEV_MODEL
          JEV_LIVE=1 bun test tests/
