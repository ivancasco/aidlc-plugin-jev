name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly live run against the Jev API, to notice model or API drift.
    - cron: "0 6 * * 1"

permissions:
  contents: read

env:
  # The AI-DLC release whose plugin tools and runtime the plugin is tested against.
  AIDLC_VERSION: "2.10.0"

# Every job installs bun, prek and pinact from mise.toml, verified against
# the checksums in mise.lock, and caches the installs between runs.

jobs:
  lint:
    name: Lint (prek)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: true
      # Hook environments (Go builds of actionlint and gitleaks, Python envs
      # for zizmor and shellcheck) rebuild only when the hooks or tools change.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/prek
          key: prek-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml', 'mise.lock') }}
      - name: Run hooks
        env:
          # pinact verifies pins and version comments through the GitHub API.
          GITHUB_TOKEN: ${{ github.token }}
        run: mise run lint

  unit:
    name: Offline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: true
      - run: mise run test

  compose:
    name: Compose (${{ matrix.harness }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        harness: [claude, codex, copilot, cursor, kiro, kiro-ide, opencode]
    # AI-DLC 2.10.0's compose hook looks for Codex skills under .codex/skills,
    # but the Codex runtime keeps them under .agents/skills, so any plugin
    # (including AI-DLC's own test-pro example) fails the idempotency check on
    # Codex. Not yet reported upstream; remove this once a fixed release is pinned.
    continue-on-error: ${{ matrix.harness == 'codex' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: true
      - name: Validate, build and compose-test
        env:
          GH_TOKEN: ${{ github.token }}
          HARNESS: ${{ matrix.harness }}
        run: mise run compose -- "$HARNESS" "$AIDLC_VERSION"

  live:
    name: Live labelled sample
    runs-on: ubuntu-latest
    # Sends the synthetic fixture text to the Jev API. The TYPESAFE_API_KEY
    # secret lives in the `live` environment, which only `main` can deploy to;
    # pull requests never run this job, and forks never receive secrets.
    if: github.event_name != 'pull_request'
    environment: live
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: true
      - name: Run live test
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          TYPESAFE_BASE_URL: ${{ vars.TYPESAFE_BASE_URL }}
          JEV_MODEL: ${{ vars.JEV_MODEL }}
        run: |
          if [ -z "$TYPESAFE_API_KEY" ]; then
            echo "::notice::TYPESAFE_API_KEY secret not set; skipping the live test."
            exit 0
          fi
          [ -n "$TYPESAFE_BASE_URL" ] || unset TYPESAFE_BASE_URL
          [ -n "$JEV_MODEL" ] || unset JEV_MODEL
          JEV_LIVE=1 mise exec -- bun test tests/
