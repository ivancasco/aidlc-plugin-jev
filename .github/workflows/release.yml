name: Release

# release-please keeps a release PR open that bumps the version (semver, from
# conventional commit messages), updates CHANGELOG.md and plugin.json's
# version. Merging that PR tags the release and publishes the GitHub Release.
# AI-DLC plugins install from git by tag, so no build files are attached.
#
# release-please acts as a GitHub App rather than with the workflow token,
# because GitHub does not start CI for pull requests the workflow token opens.
# The app's client ID and private key live in the `release` environment, which
# only `main` can deploy to.

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR / tag
    runs-on: ubuntu-latest
    environment: release
    # Everything below authenticates as the app; the workflow token is unused.
    permissions: {}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ steps.app-token.outputs.token }}
