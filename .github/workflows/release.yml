name: Release

# release-please keeps a release PR open that bumps the version (semver, from
# conventional commit messages), updates CHANGELOG.md and plugin.json's
# version. Merging that PR tags the release and publishes the GitHub Release.
#
# Host plugin managers install from git, with the marketplace file at the root
# of what they clone, so each release then publishes every harness build to
# its own branch (`claude`, `codex`, ...) with a tag `vX.Y.Z-<harness>`. See
# scripts/publish-branches.sh and README "Install".
#
# release-please acts as a GitHub App rather than with the workflow token,
# because GitHub does not start CI for pull requests the workflow token opens.
# The app's client ID and private key live in the `release` environment, which
# only `main` can deploy to.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR / tag
    runs-on: ubuntu-latest
    environment: release
    # Everything below authenticates as the app; the workflow token is unused.
    permissions: {}
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ steps.app-token.outputs.token }}

  publish:
    name: Publish harness branches
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment: release
    # The workflow token only reads (checkout, the AI-DLC release download).
    # The app token that can write is minted after the build, so the
    # downloaded AI-DLC tools never run with it.
    permissions:
      contents: read
    env:
      # The AI-DLC release whose plugin tools build the harness projections.
      # Keep in step with AIDLC_VERSION in ci.yml.
      AIDLC_VERSION: "2.10.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false
      # No cache: a release build must not restore anything a pull request
      # run could have written.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: false
      - name: Build every harness
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise exec -- scripts/build-dist.sh "$RUNNER_TEMP/dist" "$AIDLC_VERSION"
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      # Pushes made with an app token do start workflows, unlike the workflow
      # token's. Nothing here loops: CI and this workflow run on pushes to main
      # only, and no workflow runs on tags.
      - name: Push each build to its branch and tag it
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          bot="${APP_SLUG}[bot]"
          bot_id="$(gh api "/users/${bot}" --jq .id)"
          export GIT_AUTHOR_NAME="$bot"
          export GIT_AUTHOR_EMAIL="${bot_id}+${bot}@users.noreply.github.com"
          # Credentials go in as an HTTP header through the environment, so
          # they are never written to a git config file or a remote URL.
          auth="$(printf 'x-access-token:%s' "$APP_TOKEN" | base64 -w0)"
          echo "::add-mask::${auth}"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth}"
          REPO_URL="https://github.com/${REPO}" \
            scripts/publish-branches.sh "$RUNNER_TEMP/dist" "$VERSION" "https://github.com/${REPO}.git"
